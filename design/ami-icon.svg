<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
    viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">AMI — Groove</title>
  <desc id="description">Two ink-blue musical notes with five crisp, evenly spaced record grooves on pearl white.</desc>
